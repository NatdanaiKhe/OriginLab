services:
  postgres:
    image: postgres:16-alpine
    container_name: originlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: originlab
      POSTGRES_PASSWORD: password
      POSTGRES_DB: originlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
